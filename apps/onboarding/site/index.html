<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client onboarding</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F6F7F9; --ink: #111827; --mute: #4B5563; --brand: #1F2937; --brand-text: #FFFFFF; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.65; display: flex; align-items: center; justify-content: center; padding: 32px 16px;
  }
  main { max-width: 540px; text-align: center; }
  h1 { font-family: Sora, Inter, sans-serif; font-weight: 800; font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.15; margin: 0 0 16px; }
  p { color: var(--mute); margin: 0 auto 28px; max-width: 46ch; }
  .btn {
    display: inline-block; background: var(--brand); color: var(--brand-text); font-weight: 700;
    padding: 13px 30px; border-radius: 6px; text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>Client onboarding</h1>
  <p>
    If we sent you a link for your company, please use that link. Your team can
    fill it in together. If you have no link, start a new form here. It saves as
    you type, so you can stop and come back.
  </p>
  <a class="btn" href="/form">Start the onboarding form</a>
</main>
</body>
</html>
